<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avaliações</title>
<style>
:root{--ink:#1c1f3a;--mut:#626a8a;--bg:#f3f4fb;--card:#fff;--ln:#e4e6f3;
--pri:#5b4bdb;--pri2:#3b82f6;--prisoft:#eeecff;--ok:#15985a;--oksoft:#e6f7ee;--okln:#9fdfbd;
--er:#e0553b;--ersoft:#fff1ec;--erln:#f6b9a9;--warn:#b42318;--r:18px;
--sh:0 1px 2px rgba(28,31,58,.05),0 12px 32px -14px rgba(52,44,140,.22);
--grad:linear-gradient(135deg,var(--pri),var(--pri2));
--f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fd:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
--mono:"JetBrains Mono",Consolas,"SFMono-Regular",monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.6 var(--f);-webkit-font-smoothing:antialiased;
background:radial-gradient(900px 420px at 88% -90px,#e2ddff 0,transparent 70%),radial-gradient(700px 380px at -10% 0,#dbe8ff 0,transparent 65%),var(--bg)}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 18px;padding:12px max(16px,calc((100% - 860px)/2));background:linear-gradient(120deg,#1c1f3a,#2b2a72);color:#fff;box-shadow:0 8px 24px -12px rgba(28,31,58,.6)}
.hb{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 220px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:20px;flex:none}
header h1{font:700 17px/1.25 var(--fd);margin:0;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm{display:flex;flex-wrap:wrap;gap:6px 8px;font-size:13px}
.hm span:not(:empty){background:rgba(255,255,255,.13);padding:4px 12px;border-radius:99px}
main{max-width:860px;margin:0 auto;padding:22px 16px 64px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:26px;margin-bottom:18px;box-shadow:var(--sh)}
h2{font:700 26px/1.2 var(--fd);letter-spacing:-.02em;margin:0 0 8px}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
input,select{width:100%;padding:13px 14px;border:2px solid var(--ln);border-radius:12px;font:inherit;background:#fbfbff;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(91,75,219,.14);outline:0}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 24px;background:var(--grad);color:#fff;cursor:pointer;box-shadow:0 10px 20px -10px rgba(91,75,219,.8);transition:transform .15s,filter .15s,box-shadow .15s}
button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}button:active:not(:disabled){transform:none}
button:disabled{background:#dadded;color:#8f95b4;box-shadow:none;cursor:not-allowed}
button.sec{background:#eceffa;color:var(--ink);box-shadow:none}button.red{background:var(--warn);box-shadow:none}
button:focus-visible,input:focus-visible,.op:focus-visible{outline:3px solid #9a8cff;outline-offset:2px}
.rules{background:#f5f4ff;border:1px solid #dcd8ff;border-radius:14px;padding:12px 16px;margin:18px 0;font-size:14.5px;color:#3c4062}
.hero{display:grid;grid-template-columns:1fr 1.15fr;padding:0;overflow:hidden}
.hl{background:linear-gradient(150deg,#4a3cc7,#3b82f6);color:#fff;padding:30px 28px}
.hl h2{font-size:28px}.hl p{margin:0 0 18px;opacity:.92}
.dc{display:flex;flex-wrap:wrap;gap:8px}.dc span{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:99px;font-size:13.5px;font-weight:600}
.hr{padding:26px 28px}.hr h3{font:700 18px var(--fd);margin:0 0 2px}.hr .go{width:100%;margin-top:4px}
.pg{padding:18px 22px 16px}
.pgt{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 14px;margin-bottom:10px}
.pgt b{font:700 17px var(--fd)}.pgt span{font-size:13px;color:var(--mut)}
.bar{height:10px;background:#e8eaf7;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--grad);transition:width .6s cubic-bezier(.3,.8,.3,1)}
.steps{display:flex;gap:8px;overflow:auto;margin-top:14px;padding-bottom:2px}
.st{flex:none;padding:5px 12px;border-radius:99px;background:#fff;border:1px solid var(--ln);font-size:13px;font-weight:600;color:var(--mut);transition:all .3s}
.st.on{background:var(--prisoft);border-color:#c9c2ff;color:var(--pri)}.st.dn{background:var(--oksoft);border-color:var(--okln);color:var(--ok)}
.banner{display:flex;gap:14px;align-items:center;padding:16px 20px;border-radius:var(--r);background:var(--grad);color:#fff;margin-bottom:16px;animation:slide .5s cubic-bezier(.2,.8,.2,1) both}
.banner .bi{font-size:30px;width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.banner b{display:block;font:700 18px/1.25 var(--fd)}.banner span{font-size:14px;opacity:.9}
.q{padding:26px 26px 22px;animation:enter .35s cubic-bezier(.2,.8,.2,1) both;transition:opacity .17s,transform .17s}
.q.leave{opacity:0;transform:translateX(-18px)}
.qh{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.qn{flex:none;min-width:72px;padding:8px 14px 6px;border-radius:16px;background:var(--grad);color:#fff;text-align:center;line-height:1;box-shadow:0 10px 20px -10px rgba(91,75,219,.8)}
.qn small{display:block;font-size:11.5px;font-weight:600;opacity:.88;margin-bottom:4px}.qn b{font:800 30px/1 var(--fd)}
.qt{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.chip{background:var(--prisoft);color:var(--pri);font-weight:700;font-size:13.5px;padding:4px 12px;border-radius:99px}
.sub{font-size:13px;color:var(--mut)}
.q p{margin:10px 0;font-size:17px;line-height:1.65;max-width:68ch}
pre{background:#14172e;color:#e8ebff;padding:14px 16px;border-radius:12px;overflow:auto;font:14px/1.6 var(--mono);margin:12px 0}
.ops{display:grid;gap:10px;margin-top:20px}
.op{display:flex;gap:14px;align-items:center;border:2px solid var(--ln);border-radius:14px;padding:13px 16px;background:#fff;cursor:pointer;user-select:none;transition:border-color .15s,background .15s,transform .15s,box-shadow .15s,opacity .2s}
.op:hover{border-color:#b9b1ff;transform:translateY(-1px);box-shadow:0 8px 20px -14px rgba(91,75,219,.6)}
.lt{flex:none;width:34px;height:34px;border-radius:10px;background:#eef0fa;color:var(--mut);display:grid;place-items:center;font:700 14px var(--fd);transition:all .2s}
.op>span:nth-child(2),.op>pre{flex:1;min-width:0}.op pre{margin:0;background:#f3f4fb;color:var(--ink);padding:10px 12px;font-size:13px}
.op.on{border-color:var(--pri);background:var(--prisoft);box-shadow:0 8px 22px -14px rgba(91,75,219,.8)}
.op.on .lt{background:var(--grad);color:#fff}.op.on.pop{animation:pick .32s cubic-bezier(.3,1.5,.5,1)}
.op.on pre{background:#fff}
.q.done .op{cursor:default;transform:none;box-shadow:none}.q.done .op:hover{border-color:var(--ln)}
.q.done .op:not(.right):not(.wrong){opacity:.55}
.q.done .op.right{border-color:var(--ok);background:var(--oksoft);opacity:1}.q.done .op.right .lt{background:var(--ok);color:#fff}
.q.done .op.wrong{border-color:var(--er);background:var(--ersoft);opacity:1}.q.done .op.wrong .lt{background:var(--er);color:#fff}
.qf{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.hint{font-size:14px;color:var(--mut)}
#fb{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(22,24,54,.5);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
#fb.show{opacity:1;visibility:visible}
#fbc{width:min(480px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;text-align:center;padding:0 0 24px;box-shadow:0 30px 70px -20px rgba(20,22,60,.6);transform:translateY(18px) scale(.97);transition:transform .28s cubic-bezier(.2,.9,.3,1.2)}
#fb.show #fbc{transform:none}
.fh{padding:26px 24px 18px;background:linear-gradient(180deg,var(--oksoft),#fff)}.er .fh{background:linear-gradient(180deg,var(--ersoft),#fff)}
.fe{display:inline-block;font-size:70px;line-height:1.1;animation:pop .55s cubic-bezier(.2,1.5,.4,1) both}
.er .fe{animation:soft .5s ease-out both}
#fbc h3{font:700 22px/1.25 var(--fd);margin:8px 0 6px;letter-spacing:-.01em}
.fp{margin:0 auto;max-width:36ch;color:#454a6d;font-size:15.5px}
.pill{display:inline-block;margin-top:14px;padding:5px 14px;border-radius:99px;font-size:13.5px;font-weight:700;background:var(--ok);color:#fff}.er .pill{background:var(--er)}
.fx{padding:0 24px;text-align:left}
.ans,.why{border-radius:14px;padding:12px 16px;margin-top:14px;font-size:15px}
.ans{background:var(--oksoft);border:1px solid var(--okln)}.ans small,.why small{display:block;font-weight:700;font-size:13px;margin-bottom:3px}.ans small{color:var(--ok)}
.ans pre{margin:6px 0 0;font-size:13px}
.why{background:#f5f4ff;border:1px solid #dcd8ff}.why small{color:var(--pri)}
#fbc .nx{margin:20px 24px 0;width:calc(100% - 48px)}
#ov{position:fixed;inset:0;background:rgba(22,24,54,.88);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
#ov>div{background:#fff;border-radius:22px;padding:30px;max-width:440px;text-align:center;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);animation:enter .3s both}
#ov h2{color:var(--warn)}
.res{padding:0;overflow:hidden;text-align:center;animation:enter .45s both}
.rh{padding:30px 22px 22px;background:linear-gradient(150deg,#4a3cc7,#3b82f6);color:#fff}
.rh .em{font-size:52px;line-height:1.1}.rh h2{margin:6px 0 4px}.rh p{margin:0;opacity:.92}
.rb{padding:24px 24px 28px}
.rs{display:flex;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap}
.rw{position:relative;width:150px;height:150px}.ring{width:150px;height:150px;transform:rotate(-90deg)}
.rt{fill:none;stroke:#e8eaf7;stroke-width:10}.rv{fill:none;stroke:url(#gr);stroke-width:10;stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.rp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.rp b{font:800 28px var(--fd)}.rp small{font-size:12px;color:var(--mut)}
.kv{text-align:left}.kv small{display:block;color:var(--mut);font-size:13px;font-weight:600}.kv b{display:block;font:800 36px/1.1 var(--fd);margin-bottom:10px}.kv b:last-child{margin:0}
.msg{margin:24px auto 6px;max-width:520px;padding:16px 18px;border-radius:16px;background:var(--prisoft);border:1px solid #d6d1ff;text-align:left}
.msg b{display:block;font:700 18px var(--fd);margin-bottom:2px}.msg span{color:#454a6d;font-size:15px}
.dl{margin:22px 0 0;text-align:left;display:grid;gap:12px}
.dr{display:grid;grid-template-columns:minmax(120px,190px) 1fr 54px;gap:12px;align-items:center;font-size:15px;font-weight:600}
.dr .bar{height:12px}.dr .bar i{transition:width .9s cubic-bezier(.3,.8,.3,1)}.dr em{font-style:normal;text-align:right;color:var(--mut);font-weight:700}
.res .go{margin-top:26px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}
.sts{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.sts div{background:var(--prisoft);border-radius:14px;padding:10px 18px}.sts b{display:block;font:800 22px var(--fd)}.sts small{color:var(--mut);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 8px;border-bottom:1px solid var(--ln);text-align:left}th{background:#f5f4ff;color:#3c4062;position:sticky;top:0}
.tw{overflow:auto;border:1px solid var(--ln);border-radius:14px}.g{color:var(--ok);font-weight:700}.r{color:var(--warn);font-weight:700}
.nosel{user-select:none;-webkit-user-select:none}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes pick{0%{transform:scale(.98)}55%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes soft{0%{transform:translateY(12px) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
@media(max-width:700px){.hero{grid-template-columns:1fr}.hl{padding:24px 22px}.hr{padding:22px}.card{padding:20px}.q{padding:20px 18px}
.qn b{font-size:26px}.q p{font-size:16px}.dr{grid-template-columns:1fr 54px}.dr .bar{grid-column:1/3;grid-row:2}.hm .pf{display:none}
#fb{align-items:flex-end;padding:0}#fbc{border-radius:24px 24px 0 0;width:100%}.rs{gap:18px}}
.ovE{font-size:64px;line-height:1.1;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}.ovM{font-size:17px;font-weight:600;color:#454a6d;margin:4px 0 12px}.ovR{font-size:14px;color:var(--mut);margin:0 0 10px}#ov h2{font-size:22px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body>
<header><div class="hb"><span class="logo" aria-hidden="true">🎓</span><h1 id="hT">Avaliações</h1></div><div class="hm"><span id="hP" class="pf"></span><span id="hA"></span></div></header>
<main id="m"></main>
<div id="fb" role="dialog" aria-modal="true" aria-label="Resultado da questão"><div id="fbc"></div></div>
<div id="ov" role="alertdialog" aria-modal="true"><div><div id="ovE" class="ovE">🙈</div><h2 id="ovT">Você saiu da prova</h2><p id="ovM" class="ovM"></p><p class="ovR">A prova foi reiniciada, as questões mudaram de ordem e suas respostas anteriores foram apagadas.</p><p><b id="ovN"></b></p><button onclick="ov.style.display='none'">Recomeçar a prova</button></div></div>
<script>
const CFG={professor:"Mikaelle Oliveira",senha:"prof123",escola:"Avaliações"};
const D={"design": {"nome": "Design", "q": [{"titulo": "", "enun": [["t", "Uma escola desenvolveu um site para disponibilizar avisos, atividades e documentos. Após alguns testes, os alunos relataram dificuldade para identificar rapidamente quais informações eram mais importantes. A equipe percebeu que títulos, textos e botões apresentavam tamanhos e destaques muito semelhantes."], ["t", "Nesse caso, o principal problema está relacionado à falta de:"]], "op": ["Responsividade.", "Hierarquia visual.", "Programação orientada a objetos.", "Navegação por teclado.", "Texto alternativo."], "ok": 1}, {"titulo": "", "enun": [["t", "Um site utiliza a cor vermelha para indicar exclusivamente os campos obrigatórios de um formulário. Entretanto, usuários com dificuldade de percepção de cores não conseguem identificar quais campos precisam ser preenchidos."], ["t", "Para melhorar a acessibilidade, seria mais adequado:"]], "op": ["Utilizar somente cores mais fortes.", "Aumentar a quantidade de campos.", "Associar a cor a outro recurso visual ou textual.", "Retirar os campos obrigatórios.", "Utilizar imagens no lugar dos campos."], "ok": 2}, {"titulo": "", "enun": [["t", "Em uma página de notícias, os conteúdos relacionados são apresentados próximos uns dos outros, enquanto diferentes categorias possuem maior espaçamento entre si."], ["t", "Essa organização utiliza principalmente o princípio da Gestalt denominado:"]], "op": ["Similaridade.", "Proximidade.", "Continuidade.", "Figura e fundo.", "Fechamento."], "ok": 1}, {"titulo": "", "enun": [["t", "Uma página desenvolvida para computadores apresenta três colunas de conteúdo. Ao ser acessada pelo celular, os elementos são reorganizados em uma única coluna, os textos se ajustam e os botões ficam mais adequados ao tamanho da tela."], ["t", "Essa característica representa:"]], "op": ["Design responsivo.", "Design estático.", "Tipografia digital.", "Design gráfico impresso.", "Programação linear."], "ok": 0}, {"titulo": "", "enun": [["t const isCode=tx=>tx.includes('\n')||/^(if |ip |ipv6|netsh)/.test(tx);

 const x=S.q[S.pos],q=D[x.pv].q[x.i],tot=S.q.length,ans=Object.keys(S.r).length;

 $('#pb').style.width=S.pw+'%';requestAnimationFrame(()=>requestAnimationFrame(()=>{S.pw=ans/tot*100;const b=$('#pb');if(b)b.style.width=S.pw+'%'}));
 if(first){const bn=el('div','banner');bn.append(el('div','bi',emo(x.pv)));const t=el('div');t.append(el('b',0,D[x.pv].nome),el('span',0,totSec+' questões nesta seção'));bn.append(t);m.append(bn)}

  o.append(el('span','lt','ABCDE'[pos]));const tx=q.op[j];o.append(isCode(tx)?el('pre',0,tx):el('span',0,tx));
  o.onclick=()=>pick(j,o);o.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(j,o)}};ops.append(o)});

 const ft=el('div','qf'),hint=el('span','hint','Escolha uma alternativa para continuar.');hint.id='hint';

function pick(j,o){if(!S||S.lockq)return;S.sel=j;

function responder(){if(!S||S.sel==null||S.lockq)return;S.lockq=true;
 const x=S.q[S.pos],q=D[x.pv].q[x.i],j=S.sel,ok=j===q.ok;S.r[x.pv+x.i]=j;
 $('#qc').classList.add('done');document.querySelectorAll('.op').forEach(e=>{const v=+e.dataset.j;if(v===q.ok)e.classList.add('right');else if(v===j)e.classList.add('wrong')});
 $('#rb').disabled=true;const n=Object.keys(S.r).length,tot=S.q.length;$('#pa').textContent=n;S.pw=n/tot*100;$('#pb').style.width=S.pw+'%';
 if(!OPC.feedbackImediato){$('#hint').textContent='Resposta registrada.';setTimeout(next,450);return}
 showFB(ok,x,q)}

  if(isCode(tx)){a.append(el('span',0,L),el('pre',0,tx))}else a.append(el('span',0,L+tx));fx.append(a)}
 const w=el('div','why');w.append(el('small',0,'💡 Por quê?'),el('span',0,EXP[x.pv+'.'+x.i]||('A alternativa correta é: '+q.op[q.ok].replace(/\n/g,' '))));fx.append(w);fbc.append(fx);
 const b=el('button','nx',last?'Ver resultado':'Próxima questão');b.onclick=next;fbc.append(b);
 fbc.scrollTop=0;fb.classList.add('show');setTimeout(()=>b.focus({preventScroll:true}),60)}
function next(){if(!S)return;const s=S;fb.classList.remove('show');const c=$('#qc');if(c)c.classList.add('leave');
 setTimeout(()=>{if(S!==s)return;S.pos++;S.sel=null;S.lockq=false;if(S.pos>=S.q.length)fim();else{draw();scrollTo({top:0,behavior:'auto'})}},190)}
addEventListener('keydown',e=>{if(!S||ov.style.display==='flex'||fb.classList.contains('show')||S.lockq||e.ctrlKey||e.metaKey||e.altKey)return;
 const i='ABCDE'.indexOf(e.key.toUpperCase()),x=S.q[S.pos];if(e.key.length===1&&i>=0&&i<x.o.length){const o=document.querySelector('.op:nth-child('+(i+1)+')');if(o)pick(+o.dataset.j,o)}});
function fim(){const t=S.q.length,n=Object.keys(S.r).length;if(n<t&&!confirm('Faltam '+(t-n)+' questão(ões). Finalizar mesmo assim?'))return;
 const per={};K.forEach(k=>per[k]=[0,D[k].q.length]);let ac=0;const det=S.q.map(x=>{const j=S.r[x.pv+x.i],ok=j===D[x.pv].q[x.i].ok;if(ok){per[x.pv][0]++;ac++}return[x.pv,x.i,j??-1,ok?1:0]});
 det.sort((a,b)=>K.indexOf(a[0])-K.indexOf(b[0])||a[1]-b[1]);
 const R=ld('resultados_todas',[]);R.push({n:S.n,t:S.t,ac,tot:t,per,saidas:S.saidas,data:new Date().toLocaleString('pt-BR'),dur:Math.round((Date.now()-S.ini)/60000),det});
 localStorage.setItem('resultados_todas',JSON.stringify(R));localStorage.removeItem('ativo_todas');const nm=S.n,tm=S.t;S=null;onscroll=null;document.body.classList.remove('nosel');fb.classList.remove('show');head(CFG.escola,CFG.professor,'');
 const p=ac/t*100,tier=p>=90?['🏆','Excelente desempenho!','Você mostrou domínio dos conteúdos. Continue nesse ritmo!']:p>=70?['🚀','Muito bom! Você está avançando bastante!','Seus resultados mostram uma boa base. Revise os pontos que ficaram para trás.']:p>=50?['💪','Bom trabalho! Continue revisando os conteúdos.','Você já tem um bom caminho andado. Rever as explicações ajuda a subir de nível.']:['📚','Continue estudando! Cada tentativa ajuda a evoluir.','Use o que você viu aqui para direcionar seus estudos. Você consegue!'];
 m.innerHTML='';const c=el('div','card res');

 const kv=el('div','kv');kv.innerHTML='<small>Pontuação</small><b>'+ac+' / '+t+'</b><small>Aproveitamento</small><b>'+pct(ac,t)+'</b>';rs.append(rw,kv);
 const msg=el('div','msg');msg.append(el('b',0,tier[0]+' '+tier[1]),el('span',0,tier[2]));
 const dl=el('div','dl');K.forEach(k=>{const r=el('div','dr');r.append(el('span',0,emo(k)+' '+D[k].curto));const bar=el('div','bar'),i=el('i');bar.append(i);r.append(bar,el('em',0,per[k][0]+'/'+per[k][1]));dl.append(r);i.dataset.w=per[k][1]?per[k][0]/per[k][1]*100:0});
 const b=el('button','go','Voltar ao início');b.onclick=home;
 const ps=el('p');ps.style.cssText='margin:20px 0 0;font-size:14px;color:#626a8a';ps.textContent='Suas respostas foram registradas para o professor.';
 rb.append(rs,msg,dl,ps,b);c.append(rh,rb);m.append(c);scrollTo(0,0);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{$('#rv').style.strokeDashoffset=327*(1-p/100);document.querySelectorAll('.dr i').forEach(i=>i.style.width=i.dataset.w+'%')}))}
const EXIT_M=[['🙈','Ei, tá olhando pra onde?','Essa prova não está escrita na outra aba, juro.'],['🕵️','Flagrante!','O Google não sabe a resposta que você procura. E eu também vi.'],['🐌','Fugir é rápido, recomeçar é que demora.','Boa sorte com a nova ordem das questões!'],['🧙','A prova mudou de lugar. Magia!','Abracadabra: as questões embaralharam de novo.'],['🚪','Saiu pela porta dos fundos?','A prova te esperou, mas reiniciou do começo.'],['🔄','Plot twist: voltou tudo ao início.','Respostas apagadas e questões novas na ordem. Respire e vá com calma.'],['👀','Tô vendo você, hein!','Saiu da tela, e a prova reiniciou como castigo carinhoso.'],['🦊','Perdeu o foco?','A raposa embaralhou tudo enquanto você estava fora.'],['📵','Vai ficar de olho no celular?','Ele não sabe de Gestalt nem de IPv6. Foque na prova!'],['🧠','Cérebro, volte para a prova!','Quem estudou não precisa sair daqui.'],['🎢','Montanha-russa de questões!','Saiu e a prova girou: tudo em ordem nova.'],['🧹','Deu uma varrida nas suas respostas.','Saiu da tela, apagou tudo. Comece de novo com atenção.'],['🐱','Miau? Cadê você?','O gato do professor viu tudo e embaralhou as questões.'],['⏳','O relógio não parou, mas a prova voltou ao começo.','Aproveite a segunda chance e fique na tela.'],['🍿','Foi pegar pipoca?','A prova não é um filme: sair reinicia tudo.'],['🧭','Perdeu o rumo?','A bússola da prova te trouxe de volta ao início.'],['🎭','Que drama!','Cada saída fica registrada. Fique na tela e arrase!'],['🛸','Foi abduzido?','Os alienígenas devolveram você, mas as questões trocaram de lugar.']];
let exitHist=[];
function exitMsg(){let i,t=0;do{i=Math.random()*EXIT_M.length|0}while(exitHist.includes(i)&&t++<50);exitHist.push(i);if(exitHist.length>6)exitHist.shift();return EXIT_M[i]}
function showExit(n){const [e,t,f]=exitMsg();$('#ovE').textContent=e;$('#ovT').textContent=t;$('#ovM').textContent=f;$('#ovN').textContent='Saídas registradas: '+n;ov.style.display='flex'}
function violou(){if(!S||lock)return;lock=true;const n=S.saidas+1;start(S.n,S.t,n,S.ini);showExit(n);setTimeout(()=>lock=false,600)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)violou()});addEventListener('blur',violou);addEventListener('pagehide',violou);

function prof(){const s=prompt('Senha do professor:');if(s===null)return;if(s!==CFG.senha){alert('Senha incorreta.');return}painel()}
function painel(){head(CFG.escola+' – Resultados',CFG.professor,'');m.innerHTML='';const R=ld('resultados_todas',[]);
 const c=el('div','card');c.append(el('h2',0,'Resultados ('+R.length+')'));const bar=el('div','row');

 if(R.length){const sa=R.reduce((a,r)=>a+r.ac/r.tot,0)/R.length*100,so=R.reduce((a,r)=>a+r.saidas,0),st=el('div','sts');
  [[R.length,'alunos'],[String(Math.round(sa*10)/10).replace('.',',')+'%','média de aproveitamento'],[so,'saídas registradas']].forEach(([v,l])=>{const d=el('div');d.append(el('b',0,v),el('small',0,l));st.append(d)});c.append(st)}
 const tw=el('div','tw'),t=el('table');t.innerHTML='<tr><th>Aluno</th><th>Turma</th><th>Total</th>'+K.map(k=>'<th>'+D[k].curto+'</th>').join('')+'<th>Saídas</th><th>Tempo</th><th>Data</th><th></th></tr>';
 R.slice().reverse().forEach(r=>{const tr=el('tr');
  [r.n,r.t,r.ac+'/'+r.tot,...K.map(k=>r.per[k][0]+'/'+r.per[k][1]),r.saidas,r.dur+' min',r.data].forEach((x,i)=>tr.append(el('td',i==2?(r.ac/r.tot>=.6?'g':'r'):(i==3+K.length&&r.saidas?'r':''),x)));
  const td=el('td'),b=el('button','sec','Ver');b.style.padding='4px 12px';td.append(b);tr.append(td);t.append(tr);
  const d=el('tr');d.style.display='none';const dd=el('td');dd.colSpan=9+K.length;r.det.forEach(([pv,i,j,ok])=>{const q=D[pv].q[i];dd.append(el('div',ok?'g':'r',D[pv].curto+' '+(i+1)+'. '+(ok?'✔ ':'✘ ')+q.enun.find(e=>e[0]=='t')[1].slice(0,60)+'… → marcou: '+(j<0?'(em branco)':q.op[j].replace(/\n/g,' ').slice(0,50))))});d.append(dd);t.append(d);b.onclick=()=>d.style.display=d.style.display?'':'none'});
 tw.append(t);c.append(tw);if(!R.length)c.append(el('p',0,'Nenhum aluno respondeu ainda neste navegador.'));m.append(c)}
function csv(R){const l=[['Aluno','Turma','Acertos','Total',...K.map(k=>D[k].curto),'Saidas','Minutos','Data']].concat(R.map(r=>[r.n,r.t,r.ac,r.tot,...K.map(k=>r.per[k][0]),r.saidas,r.dur,r.data]));
 const b=new Blob(['\ufeff'+l.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'});const a=el('a');a.href=URL.createObjectURL(b);a.download='resultados.csv';a.click()}
const at=ld('ativo_todas',null);if(at){start(at.n,at.t,at.saidas+1,at.ini);showExit(at.saidas+1)}else home();
